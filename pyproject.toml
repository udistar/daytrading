[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrading"
version = "0.1.0"
description = "Kiwoom REST paper day-trading desktop app (v0)"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
daytrading = "daytrading.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
